        "description": "Requires an active dealer, bidder grant and CSRF protection for browser session authentication. The same key and payload replays the committed result; a different payload conflicts. A network timeout is an unknown outcome. Eligible dealer access and bid authority are checked for either authentication alternative; success requires committed accepted-bid ledger, audit and outbox. API-10: inspect the authoritative record or retry with the same key after an unknown outcome. Idempotency namespace: principal + operationId + key; recheck current access before returning stored outcome. Same payload replays once; changed payload conflicts.",
