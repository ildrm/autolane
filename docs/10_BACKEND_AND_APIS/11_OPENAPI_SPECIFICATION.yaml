    "/auth/sessions": {
      "post": {
        "operationId": "createSession",
        "summary": "Authenticate with an approved identity provider",
        "description": "Anonymous identity-provider assertion flow; generic authentication failures and throttling prevent enumeration. Protect browser login against login CSRF using approved origin and pre-authentication defenses. A session cookie and CSRF token are issued only when authentication and required MFA have completed. Idempotency namespace: principal + operationId + key; recheck current access before returning stored outcome. Same payload replays once; changed payload conflicts.",
        "parameters": [
          {
            "$ref": "#/components/parameters/IdempotencyKey"
          }
        ],
        "responses": {
          "200": {
            "description": "Identity assertion accepted. When mfa_required is false, an authenticated session may be issued; when true, authentication is incomplete and no authenticated session cookie is issued. MFA challenge contract remains a separate open specification.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthSession"
                }
              }
            },
            "headers": {
              "Set-Cookie": {
                "description": "Issued only after completed authentication; session cookie must be Secure, HttpOnly and use the approved SameSite policy.",
                "schema": {
                  "type": "string"
                }
              },
              "X-CSRF-Token": {
                "description": "Browser CSRF token issued only with a completed browser session, transported and rotated according to the approved security policy.",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "422": {
            "$ref": "#/components/responses/Error"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          },
          "202": {
            "description": "MFA pending; no authorized session cookie issued. Challenge is single use and expires in 5 minutes.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthChallenge"
                }
              }
            }
          }
        },
        "security": [],
        "requestBody": {
          "required": true,
