name: Verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: autolane
          POSTGRES_PASSWORD: autolane-local
          POSTGRES_DB: autolane
        ports: ['55432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=1024
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: pip install uv
      - run: uv sync --frozen
      - run: .venv/bin/ruff check apps/api scripts/local.py
      - run: .venv/bin/python apps/api/manage.py makemigrations --check --dry-run
      - run: .venv/bin/python apps/api/manage.py migrate --noinput
      - run: .venv/bin/python apps/api/manage.py test marketplace.tests --noinput --parallel=1
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run typecheck && npm run build
        working-directory: apps/web
